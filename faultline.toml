# Faultline configuration. Every key has a code default; this file overrides them.

[baseline]
seconds = 60              # steady-state measurement length after warm-up
warmup = 10               # seconds of probing discarded before measuring

[thresholds]
# journey error_rate_max = max(error_floor, baseline_err + k_sigma * sigma)
# sigma is the binomial std dev of an error rate measured over one watchdog window
error_floor = 0.2         # never trip below this error rate
k_sigma = 3.0             # sigmas above baseline error rate
# journey p95_max_ms = max(p95_floor_ms, baseline_p95 * p95_multiplier)
p95_floor_ms = 800        # never trip below this p95 latency
p95_multiplier = 3.0      # allowed slowdown vs baseline p95

[watchdog]
interval_s = 1.0          # evaluation period
window_s = 10             # sliding window of recent samples judged per journey
min_samples = 5           # samples a journey needs in the window before it is judged
breach_ticks = 2          # consecutive breaching evaluations before ABORT
blind_s = 5               # no prober samples for this long means ABORT (blind is unsafe)
probe_timeout_s = 3.0     # per-request prober timeout during experiments

[preflight]
probe_s = 8               # probe window that must be within thresholds before injecting

[recovery]
window_s = 10             # sliding window that must be back within thresholds
min_samples = 5           # post-revert samples per journey required
cap_s = 120               # give up and record "never recovered" after this long

[safety]
max_duration_s = 120      # longest allowed fault
max_delay_ms = 2000       # network delay cap
max_jitter_ms = 500       # network jitter cap
max_loss_pct = 30         # packet loss cap
max_spike_users = 100     # traffic spike cap (150 overloaded the load generator): Locust users (and spawn rate)
# Targets allowed for any fault. Tooling and observability are always refused in code.
allow = [
  "accounting", "ad", "astronomy-db", "cart", "checkout", "currency", "email",
  "flagd", "fraud-detection", "frontend", "frontend-proxy", "image-provider",
  "kafka", "payment", "product-catalog", "quote", "recommendation", "shipping",
  "valkey-cart",
]
crash_exclude = ["frontend-proxy"]   # allowed for delay, refused for crash
expiry_margin_s = 5       # ledger expires_at = apply time + duration + margin

[safety_agent]
enabled = true            # advisory LLM check during OBSERVING; it can only abort earlier, never override the watchdog
interval_s = 10           # period between checks
first_check_s = 5         # first check this long after injection
timeout_s = 8             # a check slower than this is ignored (watchdog verdict stands)
review = true             # pre-flight review before injection: approve, reduce (only lower) or veto; failure approves

[injection]
# Injection agent (deterministic): after the apply, every part must be seen in effect or the experiment aborts and reverts its own entries
verify_timeout_s = 10     # crash and netem: time to see the effect
spike_fraction = 0.8      # Locust user_count must reach this share of the target
spike_timeout_s = 20      # time for the spike to ramp
poll_s = 0.5              # verification poll period

[recovery_agent]
# Runs only after the deterministic revert and recovery measurement, and only when recovery was measured and failed
enabled = true
max_actions = 2           # most remediation actions per experiment; each is followed by a re-measure
settle_s = 10             # wait after an action before measuring recovery again
timeout_s = 15            # per LLM call; failure or timeout means escalate (do nothing)
remeasure_s = 60          # longest wait for the journeys to return to the baseline band after an action

[reaper]
interval_s = 2.0          # reaper loop period
stale_s = 10              # controller heartbeat older than this means revert everything
heartbeat_s = 1.0         # controller heartbeat period during an experiment

[map]
lookback_min = 60         # Jaeger lookback for dynamic edges and journey traces

[llm]
planner_model = "openai/gpt-oss-120b"
analyst_model = "openai/gpt-oss-120b"
fixer_model = "openai/gpt-oss-120b"
safety_model = "openai/gpt-oss-20b"
recovery_model = "openai/gpt-oss-20b"
rate_per_min = 25         # shared token bucket across all agents
timeout_s = 20            # per LLM request
tpm_per_model = 8000      # tokens per minute bucket per model (Groq free tier)
daily_token_budget = 180000   # per model per UTC day; calls fall back once reached
cache_ttl_s = 21600       # response cache lifetime (6 h); FAULTLINE_LLM_CACHE=0 disables it

[llm.reasoning_effort]    # gpt-oss only: low | medium | high
planner = "low"
analyst = "medium"
fixer = "medium"
safety = "low"
recovery = "low"

[llm.max_tokens]          # output cap per call, includes hidden reasoning tokens
planner = 1500
analyst = 3000
fixer = 3000
safety = 800
recovery = 800

[planner]
top_k = 8                 # candidates sent to the LLM
max_attempts = 3          # ranked candidates tried before giving up on validation
max_per_target = 2        # diversity cap inside the top-k
duration_s = 20           # delay-fault duration
crash_duration_s = 20     # crash-fault duration
delay_ms = [50, 300]      # delay intensity menu
loss_pct = [10]           # packet-loss intensity menu (with 1 ms delay)
spike_users = [50, 100]   # traffic-spike intensity menu (Locust users; the shop idles at 5)
spike_spawn_rate = 25     # users started per second
spike_duration_s = 30     # spike-fault duration
spike_tier = 2            # risk tier of every spike candidate
exclude = []              # extra targets the planner never proposes (allowlist is [safety].allow)
history = 10              # past experiments read for the recent_result component

[planner.memory]
# cross-run memory: the lowest intensity per (target, fault kind) aborted by the watchdog or safety agent is a known limit;
# candidates at or above it are not proposed. Aborts by operator, preflight, inject or system are ignored.
enabled = true
lookback_days = 7

[planner.weights]
# score = sum(weight * component); components are 0..1 except recent_result (-1..1)
fan_in = 1.0              # services that call the target, scaled by the busiest node
journeys = 2.0            # share of journeys whose path includes the target
stateful = 1.0            # 1 if the target is a data store or broker
untested = 1.5            # 1 never tested with this fault, 0.5 target tested with another fault, 0 same fault tested
recent = 1.5              # neighbours of a degraded target up, targets that held up down
severity = 0.5            # fault strength, see [planner.severity]

[planner.severity]
crash = 1.0
combo = 0.9
spike = 0.7
delay300 = 0.6
loss = 0.5
delay50 = 0.2

[planner.tiers]
# risk ladder, applied to every candidate as `tier` (derived from the map's journeys and stateful flags)
#   tier 1: delay <= light_delay_ms on any allowed target; crash of a service no journey depends on
#   tier 2: delay above light_delay_ms (300 ms); packet loss; traffic spike (spike_tier); crash of a service on some but not all journeys
#   tier 3: crash of a service on every journey, or of a stateful service (data store, broker)
light_delay_ms = 50       # delays up to this are tier 1, above it tier 2
critical = ["flagd"]      # extra targets whose crash is always tier 3 (flagd: hidden dependency, crash made cart p95 3s)
[planner.tiers.overrides]     # pin one candidate to a tier
# core paths call these many times per request, so even small delays multiply
"delay:frontend:50ms" = 2
"delay:product-catalog:50ms" = 2

[combined]
# declared combined failures: `faultline experiment --combo ... --combo ...` applies the parts together as one experiment
enabled = true            # false refuses every combo and removes combo candidates from the planner
planner = true            # the planner may propose combos, only at tier 3, built from singles that already survived
max_parts = 2             # most faults in one combo (2 or more)
allowed_pairs = ["spike+delay", "spike+loss", "spike+crash", "delay+delay", "delay+crash"]   # every pair of parts must be listed (order does not matter)
crash_deny = ["astronomy-db", "flagd", "kafka", "valkey-cart"]   # tier 3 targets: never crashed inside a combo (at most one crash per combo anyway)
p95_factor = 0.8          # a combo aborts at this share of each journey's p95 limit
error_factor = 0.8        # and of each journey's error-rate limit
max_per_plan = 3          # combo candidates kept in the planner's top-k
tier = 3                  # risk tier of every combo candidate

[fix]
# `faultline fix`: applies a Fixer proposal to a running container through the Docker API (restart policy, raised memory or CPU limit) and re-runs the experiment
max_memory_mb = 512       # largest memory limit a fix may set (limits are only ever raised, never lowered)
max_cpus = 2.0            # largest CPU limit a fix may set (only where a CPU quota already exists)
keep_if_improved = true   # true: keep the fix only on IMPROVED, revert otherwise; false: keep on IMPROVED or NO CHANGE (WORSE and INCONCLUSIVE always revert)
improve_min_penalty = 5.0 # mean penalty must drop (IMPROVED) or rise (WORSE) by at least this many points, else NO CHANGE
settle_s = 10             # container must be running, healthy and not restarted for this long before the re-run
stable_timeout_s = 60     # give up (INCONCLUSIVE, fix reverted) if it is not stable by then
rerun_max = 2             # most experiments of a weakness re-run (worst penalty first)

[run]
# `faultline run`: start at tier 1, climb one tier after climb_after survived experiments at the current tier
climb_after = 2           # COMPLETED experiments (no abort) needed at a tier before climbing; max tier is 3
cooldown_s = 10           # pause between rounds
settle_wait_s = 60        # then wait up to this long for a probe window within baseline thresholds, else stop the run

[score]
# penalty = 100 * (impact_weight * impact + breadth_weight * breadth + recovery_weight * recovery)
impact_weight = 0.5
breadth_weight = 0.3
recovery_weight = 0.2
recovery_cap_s = 60       # recovery component = min(1, recovery_s / recovery_cap_s); never recovered = 1; not measured (operator stop) = 0
recovery_floor_s = 6      # recoveries at or below this are the measurement floor (needs [recovery].min_samples clean probe samples): never a weakness
err_full = 0.5            # an error-rate rise of this much (50 points) over baseline is full degradation (1.0)
p95_full_ratio = 10.0     # a p95 of this many times baseline is full degradation (1.0), log scale
p95_base_floor_ms = 100   # baseline p95 below this is treated as this value, so tiny baselines do not inflate the ratio
affected_margin = 0.2     # journey counts as affected at this degradation (about 1.6x p95 or +10 error points), or on a threshold breach
hidden_min_impact = 0.3   # an unpredicted journey must degrade at least this much to count as a hidden dependency
weak_min_penalty = 10     # fallback ranking lists experiments at or above this penalty
max_weaknesses = 5
