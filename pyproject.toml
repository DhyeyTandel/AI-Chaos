[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.1.0"
description = "AI-driven chaos engineering for the OpenTelemetry Demo"
requires-python = ">=3.10"
dependencies = ["docker>=7", "httpx>=0.27", "typer>=0.12", "rich>=13", "pyyaml>=6",
    "langgraph>=0.2.60", "langchain-groq>=0.2.4", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
faultline = "faultline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
