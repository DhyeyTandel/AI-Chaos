name: ai-chaos

include:
  - path:
      - vendor/opentelemetry-demo/compose.yaml
      - vendor/opentelemetry-demo/compose.full.yaml
      - vendor/opentelemetry-demo/compose.observability.yaml
      - vendor/opentelemetry-demo/compose.extras.yaml
    env_file:
      - vendor/opentelemetry-demo/.env
      - demo.env

services:
  faultline:
    build: .
    image: ai-chaos/faultline:dev
    profiles: ["cli"]
    environment:
      FAULTLINE_TARGET: http://frontend-proxy:8080
      FAULTLINE_DB: /data/faultline.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COLUMNS: ${COLUMNS:-200}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - faultline-data:/data
      - ./faultline.toml:/app/faultline.toml:ro
      - ./map.overrides.yaml:/app/map.overrides.yaml:ro
      - ./reports:/app/reports

  reaper:
    container_name: reaper
    image: ai-chaos/faultline:dev
    build: .
    command: ["reaper"]
    restart: unless-stopped
    environment:
      FAULTLINE_DB: /data/faultline.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COLUMNS: ${COLUMNS:-200}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - faultline-data:/data
      - ./faultline.toml:/app/faultline.toml:ro

volumes:
  faultline-data:
